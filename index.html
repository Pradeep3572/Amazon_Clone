<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Project</title>
    <link rel="stylesheet" href="Main/amazon.css">
</head>
<body>
    <div class="main">
        <div class="header">
            <div class="logo">
                <img src="Images/amazon-logo-white.png" alt="amazon logo" class="amazon-logo">
            </div>
            <div class="search" >
                <input type="search" class="search-bar" placeholder="Search">
                <img src="Images/search-icon.png" alt="search-icon" class="search-icon">
            </div>
            <div class="return">
                <a href="Main/orders.html" target="_self" class="return-btn">
                <div>Returns</div>
                <div><b>& Orders</b></div>
                </a>
            </div>
            <div class="cart">
                <a href="Main/cart.html" target="_self">
                <img src="Images/cart-icon.png" alt="cart" class="cart-icon">
                <b class="cart-text">Cart</b>
                <p class="cart-value"><b></b></p>
                </a>
            </div>
        </div>
        <div class="products search-products">
        </div>
    </div>
<script type="module" src="Main/amazon.js"></script>
</body>
</html>
